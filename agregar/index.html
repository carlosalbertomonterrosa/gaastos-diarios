<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <title>Agregar Gasto</title>
</head>
<body>
    <div class="pagina">

        <div class="pagina-header">
            <span class="pagina-titulo">➕ Agregar Gasto</span>
            <span class="pagina-usuario" id="txt-usuario">...</span>
        </div>

        <div class="tarjeta">

            <!-- Quién gasta -->
            <div class="campo">
                <label>¿Quién gasta?</label>
                <div class="quien-grid">
                    <button class="quien-btn activo" id="quien-esposo" onclick="seleccionarQuien('esposo')">
                        👨 Esposo
                    </button>
                    <button class="quien-btn" id="quien-esposa" onclick="seleccionarQuien('esposa')">
                        👩 Esposa
                    </button>
                </div>
            </div>

            <!-- Categoría -->
            <div class="campo">
                <label>Categoría</label>
                <div class="categorias-grid" id="categorias-grid"></div>
            </div>

            <!-- Descripción -->
            <div class="campo">
                <label>Descripción</label>
                <input type="text" id="descripcion" placeholder="Ej: Mercado del sábado..."
                    class="input-campo" maxlength="100">
            </div>

            <!-- Monto -->
            <div class="campo">
                <label>Monto ($)</label>
                <input type="number" id="monto" placeholder="0"
                    class="input-campo" min="0" step="100">
            </div>

            <!-- Fecha -->
            <div class="campo">
                <label>Fecha</label>
                <input type="date" id="fecha" class="input-campo">
            </div>

            <!-- Botón guardar -->
            <button class="btn-primario" id="btn-guardar" onclick="guardarGasto()">
                💾 Guardar gasto
            </button>

        </div>

    </div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="../dashboard/">
            <span class="nav-icono">📊</span>Dashboard
        </a>
        <a href="../gastos/">
            <span class="nav-icono">📋</span>Gastos
        </a>
        <a href="../agregar/" class="activo">
            <span class="nav-icono">➕</span>Agregar
        </a>
        <a href="../historial/">
            <span class="nav-icono">🗓</span>Historial
        </a>
        <a href="../" onclick="sessionStorage.clear()">
            <span class="nav-icono">🚪</span>Salir
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
